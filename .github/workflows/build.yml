name: Android APK (LSPosed)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Clear Gradle caches (best-effort)
        run: |
          rm -rf ~/.gradle/caches/ || true
          rm -rf ~/.gradle/daemon/ || true
          rm -rf ~/.gradle/native/ || true
          rm -rf ~/.gradle/notifications/ || true

      - name: Build Debug APK
        run: gradle clean :app:assembleDebug --stacktrace --warning-mode=all --refresh-dependencies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
