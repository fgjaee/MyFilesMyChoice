name: Android APK (LSPosed)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ensure gradle.properties exists
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Clear Gradle caches (best-effort)
        run: |
          rm -rf ~/.gradle/caches/ || true
          rm -rf ~/.gradle/daemon/ || true
          rm -rf ~/.gradle/native/ || true
          rm -rf ~/.gradle/notifications/ || true

      - name: Build Debug APK
        run: gradle clean :app:assembleDebug --stacktrace --warning-mode=all --refresh-dependencies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish direct signed APK download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s 'app/build/outputs/apk/debug/app-debug.apk'
          cp 'app/build/outputs/apk/debug/app-debug.apk' 'MyFilesMyChoice.apk'
          tag=latest-apk
          printf 'Latest APK and module assets from build #%s (%s)\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > direct-release-notes.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" 'MyFilesMyChoice.apk' --clobber
            gh release edit "$tag" --title 'Latest Android APK' --notes-file direct-release-notes.txt
          else
            gh release create "$tag" 'MyFilesMyChoice.apk' --target "$GITHUB_SHA" --title 'Latest Android APK' --notes-file direct-release-notes.txt --prerelease
          fi
          echo "Direct APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/MyFilesMyChoice.apk" >> "$GITHUB_STEP_SUMMARY"
