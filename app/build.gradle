plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.filemanagerredirect'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.filemanagerredirect"
        minSdk 24
        targetSdk 34

        versionCode 1
        versionName "1.0"

        // If you use FileProvider or exported components, keep appropriate manifest placeholders here
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // keep default
        }
    }

    // Use Java 17 toolchain (matches your CI)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    // Don’t fail CI on lint nits while iterating
    lint {
        abortOnError false
    }

    // If you have META-INF clashes, uncomment:
    // packaging {
    //     resources {
    //         excludes += ['META-INF/LICENSE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
    //     }
    // }
}

dependencies {
    // AndroidX core + UI
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.2"
    implementation "androidx.fragment:fragment-ktx:1.8.2"
    implementation "androidx.preference:preference-ktx:1.2.1"

    // Material 3 (fixes missing theme/attrs)
    implementation "com.google.android.material:material:1.12.0"

    // Xposed / LSPosed APIs (compileOnly so they are not bundled)
    compileOnly "de.robv.android.xposed:api:82"
    compileOnly "org.lsposed.hiddenapibypass:hiddenapibypass:4.3"

    // Kotlin stdlib (brought transitively, but explicit is fine)
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
}