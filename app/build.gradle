plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.filemanagerredirect'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.filemanagerredirect"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner" // optional
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // If you ever enable minify true, add a keep rule for the hook class:
            // -keep class com.example.filemanagerredirect.FileManagerRedirectHook { *; }
        }
        debug {
            // default is fine
        }
    }

    // Java/Kotlin toolchains (match CI)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    // Don’t fail CI on lint nits while iterating
    lint {
        abortOnError false
    }

    // Uncomment only if you hit META-INF duplicate warnings
    // packaging {
    //     resources {
    //         excludes += ['META-INF/LICENSE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
    //     }
    // }
}

dependencies {
    // Xposed / LSPosed API (compileOnly so it is NOT packaged into the APK)
    compileOnly "de.robv.android.xposed:api:93"

    // AndroidX + Material
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.2"
    implementation "androidx.fragment:fragment-ktx:1.8.2"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "com.google.android.material:material:1.12.0"

    // Kotlin stdlib (explicit OK)
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"

    // Remove unless you actually use it:
    // compileOnly "org.lsposed.hiddenapibypass:hiddenapibypass:4.3"
}